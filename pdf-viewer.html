<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b70"><title>Reference PDF</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8edf5;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.bar{height:calc(66px + env(safe-area-inset-top));padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#123b70,#704397);color:#fff;box-shadow:0 2px 10px #0003}.close{display:grid;place-items:center;margin-left:auto;width:40px;height:40px;border-radius:50%;color:#fff;text-decoration:none;background:#ffffff20;border:1px solid #ffffff66;font-size:26px;line-height:1}.title{min-width:0;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer{display:block;width:100%;height:calc(100% - 66px - env(safe-area-inset-top));border:0;background:#fff}.fallback{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 14px;border-radius:20px;background:#123b70;color:#fff;text-decoration:none;font-size:13px;font-weight:800;box-shadow:0 3px 12px #0004}
</style></head><body><header class="bar"><div class="title" id="title">Reference PDF</div><a class="close" id="close" href="index.html" aria-label="Close document">×</a></header><iframe class="viewer" id="viewer" title="PDF document"></iframe><a class="fallback" id="external" target="_blank" rel="noopener">Open externally</a><script>
const p=new URLSearchParams(location.search),file=p.get('file')||'',title=p.get('title')||'Reference PDF';
const allowed=/^(seminars|songs)\/[a-z0-9-]+\.pdf$/i.test(file)||file==='jil-worship-one-songbook.pdf';
document.getElementById('close').href=file.startsWith('seminars/')?'basic-bible-seminars.html':'jil-songs.html';
document.getElementById('title').textContent=title;document.title=title;
if(allowed){document.getElementById('viewer').src=file;document.getElementById('external').href=file}else{document.getElementById('title').textContent='Document unavailable';document.getElementById('external').hidden=true}
</script></body></html>
